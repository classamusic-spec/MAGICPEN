<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) is meaningful.
         Pinch-zoom is left enabled (WCAG 1.4.4); the drawing canvas guards
         itself with `touch-action: none`. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fdf3e3" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Magic Pen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="MAGIC PEN — draw anything and watch it come alive." />
    <title>MAGIC PEN — Draw It. It Lives.</title>
    <!-- Typefaces are self-hosted (see @font-face in src/index.css): the app
         makes no third-party request at all until a grown-up switches on the
         one optional online feature. -->
    <link rel="preload" href="/fonts/baloo2-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🪄%3C/text%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23fdf3e3'/%3E%3Ctext x='50' y='72' font-size='62' text-anchor='middle'%3E🪄%3C/text%3E%3C/svg%3E" />
    <style>
      /* Paint the paper before React boots so the first frame is never white. */
      html, body { background: #fdf3e3; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
